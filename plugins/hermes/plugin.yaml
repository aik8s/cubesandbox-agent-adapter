name: cube-adapter-tools
version: "0.4.0"
manifest_version: 1
api_version: 1
description: Route Hermes Agent shell and file work into a policy-controlled CubeSandbox MicroVM.
author: aik8s
license: Apache-2.0
homepage: https://github.com/aik8s/cubesandbox-agent-adapter
tags:
  - sandbox
  - microvm
  - security
  - cubesandbox
provides_tools:
  - cube_exec
  - cube_status
  - cube_read
  - cube_write
  - cube_list
  - cube_job_start
  - cube_job_status
  - cube_job_output
  - cube_job_cancel
  - cube_checkpoint
  - cube_rollback
  - cube_fork
  - cube_release
  - cube_task_plan
  - cube_task_submit
  - cube_task_status
  - cube_task_result
  - cube_task_cancel
  - cube_task_receipt
config_schema:
  adapter_url:
    type: str
    default: http://127.0.0.1:18080
    description: Cube Adapter base URL reachable from Hermes Agent.
  token_file:
    type: str
    default: ""
    description: Read-only file containing the Adapter bearer token.
  token_env:
    type: str
    default: CUBE_ADAPTER_TOKEN
    description: Environment variable containing the Adapter bearer token.
  profile:
    type: str
    default: offline-code
    description: Platform-owned Cube execution policy profile.
