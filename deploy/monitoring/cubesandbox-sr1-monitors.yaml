apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cubesandbox-master
  namespace: monitoring
  labels:
    monitoring.aik8s.run/instance: aibrix
spec:
  namespaceSelector:
    matchNames:
      - cube-system
  selector:
    matchLabels:
      app.kubernetes.io/component: master
      app.kubernetes.io/instance: cube
      app.kubernetes.io/name: cube
  endpoints:
    - port: cubemaster
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - targetLabel: cluster
          replacement: sr1
        - targetLabel: cubesandbox_component
          replacement: master
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: "(cube_.*|go_.*|process_.*|promhttp_.*)"
          action: keep
---
