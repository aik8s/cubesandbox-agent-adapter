<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CubeSandbox 执行控制台</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f5f8fa;color:#172b34;font:14px system-ui,sans-serif}
main{max-width:1440px;margin:auto;padding:32px}h1{font-size:28px;margin-bottom:6px}h2{font-size:20px}p{color:#596e7a;line-height:1.7}
section{background:#fff;border:1px solid #dce5e9;border-radius:12px;padding:22px;margin:20px 0}input,button{font:inherit;padding:9px 12px;border:1px solid #cbd9df;border-radius:6px;margin:4px}button{background:#eaf4fb;color:#174f73;cursor:pointer}button:disabled{opacity:.5;cursor:default}input{max-width:100%}#token{width:390px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:11px 8px;border-bottom:1px solid #e6ecef;text-align:left;overflow-wrap:anywhere}th{background:#f8fbfc}pre{font:12px ui-monospace,monospace;white-space:pre-wrap;max-height:420px;overflow:auto;background:#f7fafc;padding:14px;border-radius:8px}#message{white-space:pre-wrap}#counts{color:#447284}label{display:inline-block}small{color:#687e89}.table-wrap{overflow:auto}
</style>
<main><h1>CubeSandbox 执行控制台</h1><p>按集群查看执行策略、任务审批和持久审计记录。</p>
<section><label>访问令牌 <input id="token" type="password" autocomplete="off" placeholder="管理员 / 审计员 / 独立审批人令牌"></label><button id="connect">连接</button><button id="forget">断开并清空</button><small>令牌只在本页内存中使用，不写入浏览器存储。</small><p id="message" role="status"></p></section>
<section><h2>集群与执行策略</h2><div id="profiles" class="table-wrap"></div></section>
<section><h2>任务审批</h2><p>查看计划、参数和执行合同后再批准。请求人与审批人权限保持分离。</p><button id="plans">刷新计划</button><div id="plan-table" class="table-wrap"></div><pre id="plan-detail" hidden></pre><div id="decisions" hidden><button id="approve">批准</button><button id="deny">拒绝</button></div></section>
<section><h2>持久审计</h2><label>操作 <input id="action" placeholder="例如 mcp_call"></label><label>集群 <input id="backend" placeholder="backend_id"></label><label>执行链 <input id="operation" placeholder="operation_id"></label><button id="query">查询</button><button id="older" disabled>更早记录</button><button id="export" disabled>导出当前查询页</button><p id="counts"></p><div id="events" class="table-wrap"></div><pre id="event-detail" hidden></pre></section>
</main>
<script>
'use strict';let bearer='',cursor=null,page=[],planRef=null;const byId=id=>document.getElementById(id);
function message(text,error=false){byId('message').textContent=text;byId('message').style.color=error?'#a82626':'#0d6652'}
async function api(path,body={}){if(!bearer)throw Error('请先输入访问令牌');const response=await fetch(path,{method:'POST',headers:{'Authorization':'Bearer '+bearer,'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});const value=await response.json();if(!response.ok)throw Error(value.error?.message||'请求失败');return value}
function table(target,headers,rows,onClick){const t=document.createElement('table'),thead=document.createElement('thead'),tr=document.createElement('tr');headers.forEach(h=>{const th=document.createElement('th');th.textContent=h;tr.append(th)});thead.append(tr);t.append(thead);const tb=document.createElement('tbody');rows.forEach((row,i)=>{const r=document.createElement('tr');row.forEach(cell=>{const td=document.createElement('td');td.textContent=cell??'—';r.append(td)});if(onClick){r.tabIndex=0;r.style.cursor='pointer';r.onclick=()=>onClick(i);r.onkeydown=e=>{if(e.key==='Enter')onClick(i)}}tb.append(r)});t.append(tb);byId(target).replaceChildren(t)}
async function query(older=false){const body={limit:100};for(const [id,key] of [['action','action'],['backend','backend_id'],['operation','operation_id']]){if(byId(id).value.trim())body[key]=byId(id).value.trim()}if(older&&cursor)body.before=cursor;const result=await api('/v1/audit/query',body);page=result.events;cursor=result.next_cursor;byId('older').disabled=!cursor;byId('export').disabled=!page.length;byId('counts').textContent=`本页 ${page.length} 条 · 持久记录 · 按序号倒序`;table('events',['序号','时间','集群','操作','阶段 / 结果','执行链'],page.map(e=>[e.seq,e.ts,e.backend_id,e.action,[e.phase,e.outcome].filter(Boolean).join(' / '),e.operation_id]),i=>{byId('event-detail').hidden=false;byId('event-detail').textContent=JSON.stringify(page[i],null,2)})}
async function plans(){const result=await api('/v1/task-plans');table('plan-table',['计划','模板','集群','状态','有效期'],result.plans.map(p=>[p.plan_ref,p.task_template,p.backend_id,p.state,p.expires_at]),async i=>{try{const p=result.plans[i];const response=await fetch('/v1/task-plans/'+encodeURIComponent(p.plan_ref),{headers:{Authorization:'Bearer '+bearer},cache:'no-store'});const detail=await response.json();if(!response.ok)throw Error(detail.error?.message||'无权查看计划');planRef=p.plan_ref;byId('plan-detail').hidden=false;byId('plan-detail').textContent=JSON.stringify(detail,null,2);byId('decisions').hidden=detail.state!=='pending_approval'}catch(e){message(e.message,true)}})}
async function connect(){if(location.protocol!=='https:'&&!['127.0.0.1','localhost','[::1]'].includes(location.hostname))throw Error('控制台需要 HTTPS；本地端口转发可使用 HTTP');bearer=byId('token').value.trim();byId('token').value='';const result=await api('/v1/profiles');table('profiles',['策略','集群','模板版本','模型','MCP','续租'],result.profiles.map(p=>[p.name,p.backend_id,p.template_version,p.models.join(', '),p.mcp_enabled?'开启':'关闭',p.keepalive_enabled?'开启':'关闭']));message('已连接');try{await plans()}catch(e){message('已连接；'+e.message,true)}try{await query()}catch(e){message('已连接；'+e.message,true)}}
for(const [id,fn] of [['connect',connect],['query',()=>query()],['older',()=>query(true)],['plans',plans],['approve',()=>decide('approve')],['deny',()=>decide('deny')]])byId(id).onclick=async()=>{try{await fn()}catch(e){message(e.message,true)}};
async function decide(decision){if(!planRef)return;await api('/v1/task-plans/'+encodeURIComponent(planRef)+'/approve',{decision});byId('decisions').hidden=true;message(decision==='approve'?'审批已记录':'拒绝已记录');await plans();await query()}
byId('export').onclick=()=>{const blob=new Blob([page.map(e=>JSON.stringify(e)).join('\n')+'\n'],{type:'application/x-ndjson'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cube-audit-page.jsonl';a.click();URL.revokeObjectURL(url)};
byId('forget').onclick=()=>{bearer='';cursor=null;page=[];planRef=null;byId('token').value='';for(const id of ['profiles','events','plan-table','counts','event-detail','plan-detail'])byId(id).replaceChildren();byId('event-detail').hidden=true;byId('plan-detail').hidden=true;byId('decisions').hidden=true;byId('older').disabled=true;byId('export').disabled=true;message('已清空本页连接信息')};
</script></html>
