openapi: 3.1.0
info:
  title: CubeSandbox Agent Adapter API
  version: 0.4.0
  description: >-
    Authenticated, tenant-aware execution broker for CubeSandbox microVMs.
    Supports action-scoped identities and approved, schema-validated trusted
    tasks with allowlisted outputs and signed execution receipts.
    Full Sandbox IDs, Cube traffic tokens, commands, output, and bearer tokens
    are intentionally excluded from audit records.
servers:
  - url: http://127.0.0.1:18080
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      operationId: health
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
  /readyz:
    get:
      security: []
      operationId: readiness
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
        "503": { $ref: "#/components/responses/JsonSuccess" }
  /metrics:
    get:
      security: []
      operationId: prometheusMetrics
      responses:
        "200":
          description: Prometheus exposition format
          content:
            text/plain:
              schema: { type: string }
  /audit:
    get:
      operationId: auditUi
      responses:
        "200":
          description: Redacted operator audit view
          content:
            text/html:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/leases:
    get:
      operationId: listLeases
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/leases/acquire:
    post:
      operationId: acquireLease
      requestBody: { $ref: "#/components/requestBodies/Acquire" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Denied" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/leases/{lease_ref}/status:
    parameters: [{ $ref: "#/components/parameters/LeaseRef" }]
    get:
      operationId: getLeaseStatus
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: refreshLeaseStatus
      requestBody: { $ref: "#/components/requestBodies/Status" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/leases/{lease_ref}/exec:
    post:
      operationId: executeCommand
      parameters: [{ $ref: "#/components/parameters/LeaseRef" }]
      requestBody: { $ref: "#/components/requestBodies/Exec" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
        "404": { $ref: "#/components/responses/NotFound" }
        "504": { $ref: "#/components/responses/Error" }
  /v1/leases/{lease_ref}/read:
    post:
      operationId: readTextFile
      parameters: [{ $ref: "#/components/parameters/LeaseRef" }]
      requestBody: { $ref: "#/components/requestBodies/Path" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
        "403": { $ref: "#/components/responses/Denied" }
  /v1/leases/{lease_ref}/write:
    post:
      operationId: writeTextFile
      parameters: [{ $ref: "#/components/parameters/LeaseRef" }]
      requestBody: { $ref: "#/components/requestBodies/Write" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
        "403": { $ref: "#/components/responses/Denied" }
  /v1/leases/{lease_ref}/list:
    post:
      operationId: listFiles
      parameters: [{ $ref: "#/components/parameters/LeaseRef" }]
      requestBody: { $ref: "#/components/requestBodies/Path" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
  /v1/leases/{lease_ref}/stat:
    post:
      operationId: statFile
      parameters: [{ $ref: "#/components/parameters/LeaseRef" }]
      requestBody: { $ref: "#/components/requestBodies/Path" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
  /v1/leases/{lease_ref}/mkdir:
    post:
      operationId: makeDirectory
      parameters: [{ $ref: "#/components/parameters/LeaseRef" }]
      requestBody: { $ref: "#/components/requestBodies/Path" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
  /v1/leases/{lease_ref}/remove:
    post:
      operationId: removeFile
      parameters: [{ $ref: "#/components/parameters/LeaseRef" }]
      requestBody: { $ref: "#/components/requestBodies/Path" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
  /v1/leases/{lease_ref}/move:
    post:
      operationId: moveFile
      parameters: [{ $ref: "#/components/parameters/LeaseRef" }]
      requestBody: { $ref: "#/components/requestBodies/Move" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
  /v1/leases/{lease_ref}/artifacts/upload:
    post:
      operationId: uploadArtifact
      parameters: [{ $ref: "#/components/parameters/LeaseRef" }]
      requestBody: { $ref: "#/components/requestBodies/ArtifactUpload" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
        "413": { $ref: "#/components/responses/Error" }
  /v1/leases/{lease_ref}/artifacts/download:
    post:
      operationId: downloadArtifact
      parameters: [{ $ref: "#/components/parameters/LeaseRef" }]
      requestBody: { $ref: "#/components/requestBodies/Path" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
        "413": { $ref: "#/components/responses/Error" }
  /v1/leases/{lease_ref}/release:
    post:
      operationId: releaseLease
      parameters: [{ $ref: "#/components/parameters/LeaseRef" }]
      requestBody: { $ref: "#/components/requestBodies/Release" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
  /v1/leases/{lease_ref}/jobs:
    post:
      operationId: startJob
      parameters: [{ $ref: "#/components/parameters/LeaseRef" }]
      requestBody: { $ref: "#/components/requestBodies/JobStart" }
      responses:
        "202": { $ref: "#/components/responses/JsonSuccess" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/jobs/{job_ref}/status:
    parameters: [{ $ref: "#/components/parameters/JobRef" }]
    get:
      operationId: getJobStatus
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
    post:
      operationId: refreshJobStatus
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
  /v1/jobs/{job_ref}/output:
    post:
      operationId: readJobOutput
      parameters: [{ $ref: "#/components/parameters/JobRef" }]
      requestBody: { $ref: "#/components/requestBodies/JobOutput" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
  /v1/jobs/{job_ref}/cancel:
    post:
      operationId: cancelJob
      parameters: [{ $ref: "#/components/parameters/JobRef" }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
  /v1/jobs/{job_ref}/events:
    get:
      operationId: streamJobEvents
      parameters:
        - $ref: "#/components/parameters/JobRef"
        - $ref: "#/components/parameters/StreamTimeout"
      responses:
        "200": { $ref: "#/components/responses/EventStream" }
  /v1/leases/{lease_ref}/ptys:
    post:
      operationId: createPty
      parameters: [{ $ref: "#/components/parameters/LeaseRef" }]
      requestBody: { $ref: "#/components/requestBodies/PtyCreate" }
      responses:
        "201": { $ref: "#/components/responses/JsonSuccess" }
  /v1/ptys/{pty_ref}/status:
    get:
      operationId: getPtyStatus
      parameters: [{ $ref: "#/components/parameters/PtyRef" }]
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
  /v1/ptys/{pty_ref}/input:
    post:
      operationId: sendPtyInput
      parameters: [{ $ref: "#/components/parameters/PtyRef" }]
      requestBody: { $ref: "#/components/requestBodies/PtyInput" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
  /v1/ptys/{pty_ref}/resize:
    post:
      operationId: resizePty
      parameters: [{ $ref: "#/components/parameters/PtyRef" }]
      requestBody: { $ref: "#/components/requestBodies/PtyResize" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
  /v1/ptys/{pty_ref}/kill:
    post:
      operationId: killPty
      parameters: [{ $ref: "#/components/parameters/PtyRef" }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
  /v1/ptys/{pty_ref}/events:
    get:
      operationId: streamPtyEvents
      parameters:
        - $ref: "#/components/parameters/PtyRef"
        - $ref: "#/components/parameters/StreamTimeout"
      responses:
        "200": { $ref: "#/components/responses/EventStream" }
  /v1/leases/{lease_ref}/checkpoints:
    parameters: [{ $ref: "#/components/parameters/LeaseRef" }]
    get:
      operationId: listCheckpoints
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
    post:
      operationId: createCheckpoint
      requestBody: { $ref: "#/components/requestBodies/CheckpointCreate" }
      responses:
        "201": { $ref: "#/components/responses/JsonSuccess" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/leases/{lease_ref}/checkpoints/{checkpoint_ref}/rollback:
    post:
      operationId: rollbackCheckpoint
      parameters:
        - $ref: "#/components/parameters/LeaseRef"
        - $ref: "#/components/parameters/CheckpointRef"
      requestBody: { $ref: "#/components/requestBodies/CheckpointAction" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
  /v1/leases/{lease_ref}/checkpoints/{checkpoint_ref}/fork:
    post:
      operationId: forkCheckpoint
      parameters:
        - $ref: "#/components/parameters/LeaseRef"
        - $ref: "#/components/parameters/CheckpointRef"
      requestBody: { $ref: "#/components/requestBodies/CheckpointAction" }
      responses:
        "201": { $ref: "#/components/responses/JsonSuccess" }
  /v1/leases/{lease_ref}/checkpoints/{checkpoint_ref}/delete:
    post:
      operationId: deleteCheckpoint
      parameters:
        - $ref: "#/components/parameters/LeaseRef"
        - $ref: "#/components/parameters/CheckpointRef"
      requestBody: { $ref: "#/components/requestBodies/CheckpointAction" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
  /v1/task-templates:
    get:
      operationId: listTaskTemplates
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
        "403": { $ref: "#/components/responses/Denied" }
  /v1/tasks/plan:
    post:
      operationId: planTrustedTask
      requestBody: { $ref: "#/components/requestBodies/TaskPlan" }
      responses:
        "201": { $ref: "#/components/responses/JsonSuccess" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Denied" }
  /v1/task-plans/{plan_ref}/approve:
    post:
      operationId: approveTrustedTaskPlan
      parameters: [{ $ref: "#/components/parameters/PlanRef" }]
      requestBody: { $ref: "#/components/requestBodies/TaskApprove" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
        "403": { $ref: "#/components/responses/Denied" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/task-plans/{plan_ref}:
    get:
      operationId: getTrustedTaskPlan
      parameters: [{ $ref: "#/components/parameters/PlanRef" }]
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/task-plans/{plan_ref}/submit:
    post:
      operationId: submitTrustedTaskPlan
      parameters: [{ $ref: "#/components/parameters/PlanRef" }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "202": { $ref: "#/components/responses/JsonSuccess" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/tasks/{task_ref}/status:
    parameters: [{ $ref: "#/components/parameters/TaskRef" }]
    get:
      operationId: getTrustedTaskStatus
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
    post:
      operationId: refreshTrustedTaskStatus
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
  /v1/tasks/{task_ref}/result:
    post:
      operationId: finalizeTrustedTask
      parameters: [{ $ref: "#/components/parameters/TaskRef" }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/tasks/{task_ref}/cancel:
    post:
      operationId: cancelTrustedTask
      parameters: [{ $ref: "#/components/parameters/TaskRef" }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
  /v1/tasks/{task_ref}/receipt:
    parameters: [{ $ref: "#/components/parameters/TaskRef" }]
    get:
      operationId: getExecutionReceipt
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
        "409": { $ref: "#/components/responses/Error" }
    post:
      operationId: readExecutionReceipt
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/admin/gc:
    post:
      operationId: runGarbageCollection
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200": { $ref: "#/components/responses/JsonSuccess" }
        "403": { $ref: "#/components/responses/Denied" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-or-JWT
  parameters:
    LeaseRef:
      name: lease_ref
      in: path
      required: true
      schema: { type: string, pattern: "^lease_[a-f0-9]{20}$" }
    JobRef:
      name: job_ref
      in: path
      required: true
      schema: { type: string, pattern: "^job_[a-f0-9]{20}$" }
    PtyRef:
      name: pty_ref
      in: path
      required: true
      schema: { type: string, pattern: "^pty_[a-f0-9]{20}$" }
    CheckpointRef:
      name: checkpoint_ref
      in: path
      required: true
      schema: { type: string, pattern: "^checkpoint_[a-f0-9]{20}$" }
    PlanRef:
      name: plan_ref
      in: path
      required: true
      schema: { type: string, pattern: "^plan_[a-f0-9]{20}$" }
    TaskRef:
      name: task_ref
      in: path
      required: true
      schema: { type: string, pattern: "^task_[a-f0-9]{20}$" }
    StreamTimeout:
      name: timeout
      in: query
      schema: { type: number, minimum: 1, maximum: 900, default: 300 }
  requestBodies:
    Acquire:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AcquireRequest" }
    Exec:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ExecRequest" }
    Path:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PathRequest" }
    Write:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WriteRequest" }
    Move:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoveRequest" }
    ArtifactUpload:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ArtifactUploadRequest" }
    Release:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReleaseRequest" }
    Status:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StatusRequest" }
    JobStart:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/JobStartRequest" }
    JobOutput:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/JobOutputRequest" }
    PtyCreate:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PtyCreateRequest" }
    PtyInput:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PtyInputRequest" }
    PtyResize:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PtyResizeRequest" }
    CheckpointCreate:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CheckpointCreateRequest" }
    CheckpointAction:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CheckpointActionRequest" }
    TaskPlan:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TaskPlanRequest" }
    TaskApprove:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TaskApproveRequest" }
    Empty:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/EmptyRequest" }
  responses:
    JsonSuccess:
      description: Successful JSON response
      content:
        application/json:
          schema: { type: object }
    EventStream:
      description: Server-sent events; PTY output payloads are Base64 encoded
      content:
        text/event-stream:
          schema: { type: string }
    Error:
      description: Adapter error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Denied:
      description: Authenticated caller is not permitted to perform the operation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource is absent or hidden by tenant isolation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    RequestId:
      type: string
      pattern: "^[A-Za-z0-9_.:-]{1,80}$"
    Path:
      type: string
      pattern: "^/(workspace|tmp)(/|$)"
    BaseRequest:
      type: object
      additionalProperties: false
      properties:
        request_id: { $ref: "#/components/schemas/RequestId" }
    EmptyRequest:
      $ref: "#/components/schemas/BaseRequest"
    AcquireRequest:
      type: object
      additionalProperties: false
      required: [runtime, session_key]
      properties:
        runtime: { type: string, enum: [openclaw, dsh, hermes, mcp] }
        session_key: { type: string, minLength: 1, maxLength: 512 }
        profile: { type: string, default: offline-code }
        request_id: { $ref: "#/components/schemas/RequestId" }
    ExecRequest:
      type: object
      additionalProperties: false
      required: [command]
      properties:
        command: { type: string, minLength: 1, maxLength: 16384 }
        cwd: { $ref: "#/components/schemas/Path" }
        timeout_ms: { type: integer, minimum: 1 }
        request_id: { $ref: "#/components/schemas/RequestId" }
    PathRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: { $ref: "#/components/schemas/Path" }
        request_id: { $ref: "#/components/schemas/RequestId" }
    WriteRequest:
      type: object
      additionalProperties: false
      required: [path, content]
      properties:
        path: { $ref: "#/components/schemas/Path" }
        content: { type: string, maxLength: 262144 }
        request_id: { $ref: "#/components/schemas/RequestId" }
    MoveRequest:
      type: object
      additionalProperties: false
      required: [path, destination]
      properties:
        path: { $ref: "#/components/schemas/Path" }
        destination: { $ref: "#/components/schemas/Path" }
        request_id: { $ref: "#/components/schemas/RequestId" }
    ArtifactUploadRequest:
      type: object
      additionalProperties: false
      required: [path, content_base64]
      properties:
        path: { $ref: "#/components/schemas/Path" }
        content_base64: { type: string, contentEncoding: base64 }
        request_id: { $ref: "#/components/schemas/RequestId" }
    ReleaseRequest:
      type: object
      additionalProperties: false
      properties:
        action: { type: string, enum: [pause, kill], default: pause }
        request_id: { $ref: "#/components/schemas/RequestId" }
    StatusRequest:
      type: object
      additionalProperties: false
      properties:
        refresh: { type: boolean, default: true }
        request_id: { $ref: "#/components/schemas/RequestId" }
    JobStartRequest:
      type: object
      additionalProperties: false
      required: [command]
      properties:
        command: { type: string, minLength: 1, maxLength: 16384 }
        cwd: { $ref: "#/components/schemas/Path" }
        request_id: { $ref: "#/components/schemas/RequestId" }
    JobOutputRequest:
      type: object
      additionalProperties: false
      properties:
        offset: { type: integer, minimum: 0, default: 0 }
        max_bytes: { type: integer, minimum: 1, maximum: 1048576 }
        request_id: { $ref: "#/components/schemas/RequestId" }
    PtyCreateRequest:
      type: object
      additionalProperties: false
      properties:
        rows: { type: integer, minimum: 1, maximum: 1000, default: 24 }
        cols: { type: integer, minimum: 1, maximum: 1000, default: 80 }
        cwd: { $ref: "#/components/schemas/Path" }
        request_id: { $ref: "#/components/schemas/RequestId" }
    PtyInputRequest:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { type: string, maxLength: 262144 }
        request_id: { $ref: "#/components/schemas/RequestId" }
    PtyResizeRequest:
      type: object
      additionalProperties: false
      required: [rows, cols]
      properties:
        rows: { type: integer, minimum: 1, maximum: 1000 }
        cols: { type: integer, minimum: 1, maximum: 1000 }
        request_id: { $ref: "#/components/schemas/RequestId" }
    CheckpointCreateRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        request_id: { $ref: "#/components/schemas/RequestId" }
    CheckpointActionRequest:
      type: object
      additionalProperties: false
      properties:
        branch: { type: string, minLength: 1, maxLength: 128 }
        request_id: { $ref: "#/components/schemas/RequestId" }
    TaskPlanRequest:
      type: object
      additionalProperties: false
      required: [template, parameters]
      properties:
        template: { type: string, pattern: "^[a-z][a-z0-9-]{0,62}$" }
        parameters: { type: object }
        request_id: { $ref: "#/components/schemas/RequestId" }
    TaskApproveRequest:
      type: object
      additionalProperties: false
      properties:
        decision: { type: string, enum: [approve, deny], default: approve }
        reason: { type: string, maxLength: 1024 }
        request_id: { $ref: "#/components/schemas/RequestId" }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
