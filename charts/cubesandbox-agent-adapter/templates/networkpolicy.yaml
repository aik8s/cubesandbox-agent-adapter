{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cubesandbox-agent-adapter.fullname" . }}
  labels:
    {{- include "cubesandbox-agent-adapter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cubesandbox-agent-adapter.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.clientPodSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.cubeNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.cubeApiPort }}
        - protocol: TCP
          port: {{ .Values.networkPolicy.cubeProxyPort }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.state.enabled }}
    - to:
        {{- if .Values.networkPolicy.redisNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.redisNamespace }}
          {{- with .Values.networkPolicy.redisPodSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
        {{- else }}
        {{- with .Values.networkPolicy.redisPodSelector }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.redisPort }}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
