{{- if and .Values.audit.persistence.enabled (not .Values.audit.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cubesandbox-agent-adapter.fullname" . }}-audit
  labels:
    {{- include "cubesandbox-agent-adapter.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.audit.persistence.accessModes | nindent 4 }}
  {{- if .Values.audit.persistence.storageClass }}
  storageClassName: {{ .Values.audit.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.audit.persistence.size }}
{{- end }}
