{{- if and .Values.taskTemplates.enabled (not .Values.taskTemplates.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cubesandbox-agent-adapter.fullname" . }}-task-templates
  labels:
    {{- include "cubesandbox-agent-adapter.labels" . | nindent 4 }}
data:
  {{ .Values.taskTemplates.key }}: |
    {{- toYaml .Values.taskTemplates.data | nindent 4 }}
{{- end }}
