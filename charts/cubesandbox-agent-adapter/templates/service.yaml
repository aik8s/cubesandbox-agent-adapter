apiVersion: v1
kind: Service
metadata:
  name: {{ include "cubesandbox-agent-adapter.fullname" . }}
  labels:
    {{- include "cubesandbox-agent-adapter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "cubesandbox-agent-adapter.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
