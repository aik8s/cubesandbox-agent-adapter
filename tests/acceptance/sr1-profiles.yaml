defaults:
  template: agent-code
  allow_internet_access: false
  network:
    allow_public_traffic: false
  allowed_runtimes: [mcp]
  max_active_leases_per_tenant: 4
  max_jobs_per_lease: 1
  checkpoints_enabled: false
  workspace:
    mode: ephemeral

profiles:
  trusted-acceptance:
    sandbox_timeout_seconds: 600
    max_command_seconds: 300
    lease_idle_ttl_seconds: 600
    lifecycle:
      on_timeout: kill
      auto_resume: false
