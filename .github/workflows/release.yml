name: Release image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image:
        description: Existing immutable GHCR image to verify without rebuilding
        required: true
        type: string
      version:
        description: Expected Adapter version
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: adapter
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
  verify:
    needs: image
    if: always() && (needs.image.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7
      - if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v4
      - name: Verify immutable published runtime
        env:
          RELEASE_IMAGE: ${{ inputs.image || needs.image.outputs.image }}
          EXPECTED_VERSION: ${{ inputs.version }}
          RELEASE_REPOSITORY: ghcr.io/${{ github.repository }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          [[ "$RELEASE_IMAGE" == "$RELEASE_REPOSITORY"@sha256:* ]]
          digest="${RELEASE_IMAGE#*@sha256:}"
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          version="${EXPECTED_VERSION:-$(cat VERSION)}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # Each architecture has its own runner: the classic Docker store
          # cannot retain two platform variants under one index digest.
          test "$(docker run --rm --platform "$RELEASE_PLATFORM" "$RELEASE_IMAGE" --version)" = "$version"
          docker run --rm --platform "$RELEASE_PLATFORM" --entrypoint python "$RELEASE_IMAGE" \
            -c 'import importlib.metadata as m, os; assert m.version("cubesandbox") == "0.7.3"; assert os.geteuid() != 0; print("SDK 0.7.3 / non-root runtime OK")'
