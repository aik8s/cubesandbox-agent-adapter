services:
  adapter:
    image: ghcr.io/aik8s/cubesandbox-agent-adapter:v0.3.0
    build:
      context: ./adapter
    env_file:
      - .env
    ports:
      - 127.0.0.1:18080:18080
    volumes:
      - ./config/profiles.yaml:/etc/cube-adapter/profiles.yaml:ro
      - cube-adapter-audit:/var/log/cube-adapter
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=65532,gid=65532
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/readyz')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    profiles: [ha]
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - cube-adapter-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  cube-adapter-audit:
  cube-adapter-redis:
