defaults:
  sandbox_timeout_seconds: 300
  max_command_seconds: 120
  lease_idle_ttl_seconds: 3600
  max_active_leases_per_tenant: 8
  max_jobs_per_lease: 8

profiles:
  offline-code:
    allow_internet_access: false
    network:
      allow_public_traffic: false
    lifecycle:
      on_timeout: pause
      auto_resume: true

  persistent-code:
    allow_internet_access: false
    network:
      allow_public_traffic: false
    workspace:
      mode: per-session-volume
      retain_on_kill: true
    # CubeSandbox v0.7.1 supports mounted-workspace checkpoints as external
    # references: VM/rootfs rolls back, mounted data does not. Keep this profile
    # disabled unless allow_checkpoint_with_mounts is explicitly enabled after
    # storage-driver, node-affinity, restore, rollback and clone validation.
    checkpoints_enabled: false

  checkpoint-code:
    allow_internet_access: false
    network:
      allow_public_traffic: false
    checkpoints_enabled: true
