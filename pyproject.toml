[project]
name = "cubesandbox-agent-adapter"
version = "0.4.0"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["docs/assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = [
  "E501",
  "S101",
  "S108",
  "S110",
  "S112",
  "S310",
]

[tool.ruff.lint.per-file-ignores]
"adapter/test_*.py" = ["S105", "S106"]
"plugins/hermes/test_plugin.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_any_generics = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["adapter/test_.*\\.py", "plugins/hermes/test_plugin.py"]

[[tool.mypy.overrides]]
module = ["cubesandbox.*", "jwt.*", "redis.*", "prometheus_client.*", "mcp.*"]
ignore_missing_imports = true
